name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generér hemmeligheder (kun CI)
        run: ./scripts/init-secrets.sh
      - name: Byg
        run: docker compose build migrate test
      - name: Start database
        run: docker compose up -d db
      - name: Unit-, property-, statistik- og integrationstests
        run: docker compose --profile test run --rm test
      - name: TLS-proxy (kun CI – produktion bruger egen reverse proxy)
        run: docker run -d --name tls --network host caddy:2 caddy reverse-proxy --from localhost:443 --to 127.0.0.1:8000
      - name: Fuld stak + smoke-test
        run: |
          docker compose up -d
          for i in $(seq 1 40); do docker compose ps api --format '{{.Status}}' | grep -q healthy && break; sleep 3; done
          docker compose exec -T api python -m app.cli seed-demo > /tmp/demo.txt
          CODE=$(grep "Skole Syd" /tmp/demo.txt | awk -F': ' '{print $2}')
          PW=$(grep "demo.org" /tmp/demo.txt | awk -F': ' '{print $2}')
          python3 scripts/smoke_test.py --code "$CODE" --admin demo.org --password "$PW" --new-password "$(openssl rand -base64 24)"
      - name: Tilgængelighed (axe)
        run: |
          CODE=$(grep "Dagtilbud Solsikken" /tmp/demo.txt | awk -F': ' '{print $2}')
          mkdir -p /tmp/e2e-out
          docker run --rm --network host -e E2E_CODE="$CODE" -v $PWD/tests/e2e:/e2e -v /tmp/e2e-out:/out \
            -w /tmp/w mcr.microsoft.com/playwright:v1.49.1-jammy \
            bash -c "cp /e2e/package.json /e2e/a11y.mjs . && npm install --no-audit --no-fund && node a11y.mjs"
      - name: Logs ved fejl
        if: failure()
        run: docker compose logs --no-color | tail -200
