name: questionnaire

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app-env: &app-env
  APP_ENV: ${APP_ENV}
  APP_VERSION: ${APP_VERSION}
  PUBLIC_HOST: ${PUBLIC_HOST}
  PUBLIC_PORT: ${PUBLIC_PORT:-443}
  HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
  DB_HOST: db
  CODE_LOOKUP_PEPPER: ${CODE_LOOKUP_PEPPER}
  IP_HASH_KEY: ${IP_HASH_KEY}
  TOTP_ENC_KEY: ${TOTP_ENC_KEY}
  MIN_CELL_SIZE: ${MIN_CELL_SIZE}
  RESPONDENT_SESSION_TTL: ${RESPONDENT_SESSION_TTL}
  RESPONDENT_SESSION_MAX: ${RESPONDENT_SESSION_MAX}
  RESUME_KEY_TTL_DAYS: ${RESUME_KEY_TTL_DAYS}
  ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL}
  ADMIN_SESSION_MAX: ${ADMIN_SESSION_MAX}
  RL_CODE_ATTEMPTS: ${RL_CODE_ATTEMPTS}
  RL_CODE_WINDOW: ${RL_CODE_WINDOW}
  RL_LOGIN_ATTEMPTS: ${RL_LOGIN_ATTEMPTS}
  RL_LOGIN_WINDOW: ${RL_LOGIN_WINDOW}
  DEFAULT_RETENTION_MONTHS: ${DEFAULT_RETENTION_MONTHS}

services:
  db:
    <<: *hardening
    image: mariadb:11.4
    user: "999:999"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_ROOT_HOST: localhost
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD}
      DB_API_PASSWORD: ${DB_API_PASSWORD}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/conf/99-hardening.cnf:/etc/mysql/conf.d/99-hardening.cnf:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./secrets/mariadb-keys.enc:/etc/mysql/encryption/keys.enc:ro
      - ./secrets/mariadb-filekey:/etc/mysql/encryption/filekey:ro
    tmpfs:
      - /tmp:uid=999,gid=999,mode=0700
      - /run/mysqld:uid=999,gid=999,mode=0755
      - /var/lib/mysql-files:uid=999,gid=999,mode=0700
    networks: [backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: final
    image: questionnaire-backend:local
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
      DB_USER: qa_migrate
      DB_PASSWORD: ${DB_MIGRATE_PASSWORD}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *hardening
    image: questionnaire-backend:local
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
      DB_USER: qa_api
      DB_PASSWORD: ${DB_API_PASSWORD}
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=2
      - --proxy-headers
      - --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-172.30.0.1}
      - --no-server-header
      - --no-date-header
      - --timeout-keep-alive=5
      - --limit-concurrency=200
      - --log-level=info
      - --no-access-log
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Kun HTTP – TLS termineres i din egen reverse proxy, som peger på denne port.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *hardening
    image: questionnaire-backend:local
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
      DB_USER: qa_worker
      DB_PASSWORD: ${DB_WORKER_PASSWORD}
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  # Testkørsel: docker compose --profile test run --rm test
  test:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    image: questionnaire-backend:test
    profiles: ["test"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      <<: *app-env
      APP_ENV: test
      DB_USER: qa_migrate
      DB_PASSWORD: ${DB_MIGRATE_PASSWORD}
      DB_SCHEMA_PREFIX: "test_"
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
    volumes:
      - ./backend/tests:/app/tests:ro
      - ./schema:/app/schema:ro
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db-data:
